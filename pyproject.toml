[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "danilabs-validator"
version = "0.1.0"
description = "Read-only DaniLabs finalized-chain observer"
requires-python = ">=3.11"
dependencies = ["bittensor==9.12.2"]

[project.scripts]
dani-validator = "danilabs_validator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
